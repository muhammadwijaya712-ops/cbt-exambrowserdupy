name: Build EduShield Exam Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Perbaiki Ikon & Cek Struktur Proyek
        run: |
          if [ -f "EduShield-ExamBrowser/build.gradle.kts" ]; then
            cd EduShield-ExamBrowser
          fi
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E1B4B"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#34D399"
                  android:pathData="M54,24L30,34v18c0,15.5 10.2,30 24,34c13.8,-4 24,-18.5 24,-34V34L54,24zM50,62l-10,-10l3.5,-3.5L50,55l14.5,-14.5L68,44L50,62z" />
          </vector>
          EOF
          sed -i 's/@mipmap\/ic_launcher_round/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          if [ -f "EduShield-ExamBrowser/build.gradle.kts" ]; then
            cd EduShield-ExamBrowser
          fi
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduShield-ExamBrowser-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
