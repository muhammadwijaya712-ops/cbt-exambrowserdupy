    const DEFAULT_SUPABASE_URL = "https://obdilkmyewfxrwfoicov.supabase.co";
    const DEFAULT_SUPABASE_ANON_KEY = "sb_publishable_VA-8HLuqFNrbaKatDPqutQ_feySBhUK";

    let supabaseClient = null;
    let realtimeChannel = null;
    let countdownInterval = null;
    let blurLockTimeout = null;

    function getSupabaseCredentials() {
      const savedUrl = (localStorage.getItem('sb_url') || '').trim();
      const savedKey = (localStorage.getItem('sb_key') || '').trim();
      const url = savedUrl || DEFAULT_SUPABASE_URL.trim();
      const key = savedKey || DEFAULT_SUPABASE_ANON_KEY.trim();
      return { url, key, isFromLocalStorage: Boolean(savedUrl && savedKey) };
    }

    function initSupabaseClient() {
      const { url, key } = getSupabaseCredentials();
      if (!url || !key || !window.supabase) {
        supabaseClient = null;
        updateConnectionBadge(false);
        return false;
      }
      try {
        supabaseClient = window.supabase.createClient(url, key, {
          auth: {
            persistSession: true,
            autoRefreshToken: true
          }
        });
        updateConnectionBadge(true);
        return true;
      } catch (err) {
        console.error('Gagal inisialisasi Supabase:', err);
        supabaseClient = null;
        updateConnectionBadge(false);
        return false;
      }
    }

    function updateConnectionBadge(isConfigured) {
      const badge = document.getElementById('connection-badge');
      if (!badge) return;
      if (isConfigured) {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Supabase Terhubung`;
      } else {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Belum Dikonfigurasi`;
      }
    }

      // State Login

        // Tab 1: Bank Soal & Word Import
        questions: [],

        showManualForm: false,
        savingManualQuestion: false,
        wordPreview: {

    /**
     * ============================================================================
     * 3. UTILITAS UMUM, TOAST & MODAL KONFIRMASI
     * ============================================================================
     */
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeXML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function generateRandomToken(length = 6) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function formatCountdown(totalSec) {
      const s = Math.max(0, Math.floor(totalSec));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatDateTimeID(isoString) {
      if (!isoString) return '-';
      try {
        const d = new Date(isoString);
        return d.toLocaleString('id-ID', {
          day: '2-digit',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return isoString;
      }
    }

    // Mengacak urutan soal secara konsisten berdasarkan seed (siswa_id + exam_id)
    function deterministicShuffle(array, seedStr) {
      const arr = [...array];
      let hash = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        hash ^= seedStr.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const nextRand = () => {
        hash += 0x6D2B79F5;
        let t = Math.imul(hash ^ (hash >>> 15), 1 | hash);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(nextRand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-emerald-900/95 text-white border-emerald-500/40',
        error: 'bg-rose-900/95 text-white border-rose-500/40',
        warning: 'bg-amber-900/95 text-white border-amber-500/40',
        info: 'bg-slate-900/95 text-white border-indigo-500/40'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-octagon',
        warning: 'alert-triangle',
        info: 'info'
      };
      const iconColors = {
        success: 'text-emerald-400',
        error: 'text-rose-400',
        warning: 'text-amber-400',
        info: 'text-indigo-400'
      };

      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md text-xs sm:text-sm font-medium transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.info}`;
      el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 ${iconColors[type] || 'text-indigo-400'}"></i><span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      if (window.lucide) lucide.createIcons();

      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3800);
    }

    // Modal Konfirmasi Kustom (Pengganti confirm() bawaan browser)
    function openConfirmModal({ title, message, confirmLabel = 'Ya, Lanjutkan', confirmClass = 'bg-indigo-600 hover:bg-indigo-700', onConfirm }) {
      const modal = document.getElementById('confirm-modal');
      if (!modal) return;

      modal.classList.remove('hidden');
      modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
          <h3 class="text-lg font-bold text-slate-900 mb-2">${escapeHTML(title)}</h3>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-6">${escapeHTML(message)}</p>
          <div class="flex items-center justify-end gap-2.5">
            <button
              type="button"
              id="confirm-modal-cancel"
              class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs sm:text-sm hover:bg-slate-50 cursor-pointer"
            >
              Batal
            </button>
            <button
              type="button"
              id="confirm-modal-ok"
              class="px-4 py-2.5 rounded-xl text-white font-bold text-xs sm:text-sm shadow-sm cursor-pointer ${confirmClass}"
            >
              ${escapeHTML(confirmLabel)}
            </button>
          </div>
        </div>
      `;

      document.getElementById('confirm-modal-cancel').onclick = () => {
        modal.classList.add('hidden');
      };
      document.getElementById('confirm-modal-ok').onclick = async () => {
        modal.classList.add('hidden');
        if (typeof onConfirm === 'function') {
          await onConfirm();
        }
      };
    }

    function copyTextSafe(text) {
      const inp = document.createElement('input');
      inp.value = text;
      document.body.appendChild(inp);
      inp.select();
      try {
        document.execCommand('copy');
        showToast(`Disalin ke clipboard: ${text}`, 'info');
      } catch (e) {
        showToast(`Kode: ${text}`, 'info');
      }
      document.body.removeChild(inp);
    }

    /**
     * ============================================================================
     * 4. MODAL PENGATURAN KONEKSI SUPABASE
     * ============================================================================
     */
    function openSupabaseConfigModal() {
      const modal = document.getElementById('supabase-config-modal');
      if (!modal) return;

      const { url, key } = getSupabaseCredentials();
      modal.classList.remove('hidden');
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
          <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <i data-lucide="database" class="w-5 h-5 text-emerald-400"></i>
              <h3 class="text-base font-bold">Pengaturan Koneksi Supabase</h3>
            </div>
            <button type="button" onclick="closeSupabaseConfigModal()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <form onsubmit="saveSupabaseConfig(event)" class="p-6 space-y-4">
            <div class="p-3.5 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900 leading-relaxed">
              Ambil <strong>Project URL</strong> dan <strong>anon public key</strong> dari dashboard proyek Supabase Anda di menu <em>Project Settings &rarr; API</em>. Data disimpan secara aman di <code class="font-mono bg-white px-1 rounded">localStorage</code> browser ini.
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                Supabase Project URL
              </label>
              <input
                type="url"
                name="sbUrl"
                required
                value="${escapeHTML(url)}"
                placeholder="https://xxxxxxxxxxxx.supabase.co"

              />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                Supabase Anon Public Key
              </label>
              <textarea
                name="sbKey"
                rows="3"
                required
                placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 font-mono text-xs text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none"
              >${escapeHTML(key)}</textarea>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
              <button
                type="button"
                onclick="clearSupabaseConfig()"
                class="px-3.5 py-2 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold cursor-pointer"
              >
                Reset Kredensial
              </button>

              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="closeSupabaseConfigModal()"
                  class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs sm:text-sm font-semibold hover:bg-slate-50 cursor-pointer"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold shadow-sm cursor-pointer"
                >
                  Simpan &amp; Hubungkan
                </button>
              </div>
            </div>
          </form>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function closeSupabaseConfigModal() {
      const modal = document.getElementById('supabase-config-modal');
      if (modal) modal.classList.add('hidden');
    }

    async function saveSupabaseConfig(event) {
      event.preventDefault();
      const f = event.target;
      const url = f.sbUrl.value.trim();
      const key = f.sbKey.value.trim();

      if (!url || !key) {
        showToast('URL dan Anon Key wajib diisi.', 'warning');
        return;
      }

      localStorage.setItem('sb_url', url);
      localStorage.setItem('sb_key', key);

      const ok = initSupabaseClient();
      closeSupabaseConfigModal();

      if (ok) {
        showToast('Konfigurasi Supabase berhasil disimpan dan terhubung!', 'success');
        await bootstrapAuthSession();
      } else {
        showToast('Format URL atau Key Supabase tidak valid.', 'error');
        render();
      }
    }

    function clearSupabaseConfig() {
      localStorage.removeItem('sb_url');
      localStorage.removeItem('sb_key');
      initSupabaseClient();
      closeSupabaseConfigModal();
      render();
      showToast('Kredensial localStorage telah dihapus.', 'info');
    }

    /**
     * ============================================================================
     * 5. AUTENTIKASI & PEMISAHAN ROLE (public.profiles)
     * ============================================================================
     */
    async function bootstrapAuthSession() {
      cleanupIntervalsAndRealtime();

      if (!supabaseClient) {
        state.screen = 'login';
        state.authUser = null;
        state.profile = null;
        render();
        return;
      }

      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;

        if (!session || !session.user) {
          state.screen = 'login';
          state.authUser = null;
          state.profile = null;
          render();
          return;
        }

        await resolveUserProfileAndRoute(session.user);
      } catch (err) {
        console.error('Session bootstrap error:', err);
        state.screen = 'login';
        render();
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      if (!supabaseClient) {
        state.loginError = 'Koneksi Supabase belum diatur. Klik tombol "Pengaturan Koneksi Supabase" terlebih dahulu.';
        render();
        openSupabaseConfigModal();
        return;
      }

      const f = event.target;
      let rawUsername = (f.username.value || '').trim().toLowerCase();
      const password = f.password.value || '';

      if (!rawUsername || !password) {
        state.loginError = 'Username dan password wajib diisi.';
        render();
        return;
      }

      // Otomatis tambahkan domain sekolah jika tidak mengandung '@'
      const email = rawUsername.includes('@') ? rawUsername : `${rawUsername}@sekolah.sch.id`;

      state.loginSubmitting = true;
      state.loginError = '';
      render();

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw new Error(error.message === 'Invalid login credentials'
            ? 'Username atau password salah. Periksa kembali akun Anda.'
            : error.message);
        }

        await resolveUserProfileAndRoute(data.user);
      } catch (err) {
        state.loginSubmitting = false;
        state.loginError = err.message || 'Gagal masuk ke sistem.';
        render();
      }
    }

    async function resolveUserProfileAndRoute(user) {
      try {
        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        if (error || !profile) {
          throw new Error('Akun berhasil login, tetapi data profil belum terdaftar di tabel public.profiles. Hubungi Administrator sekolah.');
        }

        state.authUser = user;
        state.profile = profile;
        state.loginSubmitting = false;
        state.loginError = '';

        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode');

        // Pemisahan tegas berdasarkan role
        if (profile.role === 'guru' || profile.role === 'admin') {
          if (modeParam === 'siswa') {
            state.screen = 'role_blocked';
            render();
            return;
          }
          state.screen = 'teacher';
          render();
          await loadTeacherExams();
        } else if (profile.role === 'siswa') {
          // Pastikan siswa tidak bisa masuk ke tampilan guru dalam kondisi apapun

    async function loadTeacherExams() {
      if (!supabaseClient || !state.profile) return;

      try {
        let query = supabaseClient
          .from('exams')
          .select('*')
          .order('created_at', { ascending: false });

        // Guru hanya melihat ujian miliknya sendiri; admin dapat melihat semua jika perlu atau miliknya
        if (state.profile.role === 'guru') {
          query = query.eq('guru_id', state.profile.id);
        }

        const { data, error } = await query;
        if (error) throw error;

        state.teacher.exams = data || [];
        if (state.teacher.exams.length > 0) {
          const stillExists = state.teacher.exams.some(e => e.id === state.teacher.selectedExamId);
          if (!stillExists) {
            state.teacher.selectedExamId = state.teacher.exams[0].id;
          }
          await onTeacherExamChanged(state.teacher.selectedExamId);
        } else {
          state.teacher.selectedExamId = null;
          state.teacher.questions = [];
          state.teacher.sessions = [];
          render();
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal memuat daftar paket ujian: ' + err.message, 'error');
      }
    }

    // Konversi Data URI base64 menjadi Blob untuk diunggah ke Supabase Storage
    function dataUriToBlob(dataUri) {
      const parts = dataUri.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/png';
      const binaryStr = atob(parts[1]);
      const len = binaryStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      return { blob: new Blob([bytes], { type: mime }), mime };
    }

    // Upload file gambar ke bucket Supabase Storage 'gambar-soal'
    async function uploadImageBlobToStorage(blob, ext = 'png') {
      const exam = getSelectedTeacherExam();
      if (!supabaseClient || !exam) return null;

      const filePath = `${exam.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
      const { error: uploadError } = await supabaseClient.storage
        .from('gambar-soal')
        .upload(filePath, blob, {
          cacheControl: '3600',
          upsert: false
        });

      if (uploadError) {
        throw uploadError;
      }

      const { data: pubData } = supabaseClient.storage
        .from('gambar-soal')
        .getPublicUrl(filePath);

      return pubData ? pubData.publicUrl : null;
    }

    // Upload & Parse file .docx menggunakan Mammoth.js + Upload gambar ke Storage
    async function handleDocxUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const exam = getSelectedTeacherExam();
      if (!exam) {
        showToast('Pilih atau buat paket ujian terlebih dahulu.', 'warning');
        event.target.value = '';
        return;
      }

      if (!file.name.toLowerCase().endsWith('.docx')) {
        showToast('File harus berformat Microsoft Word (.docx).', 'error');
        event.target.value = '';
        return;
      }

      state.teacher.wordPreview = {
        fileName: file.name,
        items: [],
        uploadingImages: true,
        savingToDb: false
      };
      render();

      try {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.convertToHtml({ arrayBuffer });
        const parser = new DOMParser();
        const doc = parser.parseFromString(result.value, 'text/html');
        const table = doc.querySelector('table');

        if (!table) {
          throw new Error('Tabel 8 kolom tidak ditemukan di dalam file Word. Gunakan Template_Soal_EduShield.docx.');
        }

        const rows = Array.from(table.querySelectorAll('tr'));
        if (rows.length <= 1) {
          throw new Error('Tabel di dalam file Word masih kosong.');
        }

        const parsedItems = [];
        let storageWarningShown = false;

        for (let i = 1; i < rows.length; i++) {
          const cells = Array.from(rows[i].querySelectorAll('td, th'));
          if (cells.length < 7) continue;

          const imgEl = cells[1].querySelector('img');
          const rawImgSrc = imgEl ? imgEl.getAttribute('src') : null;

          const pertanyaan = (cells[1].textContent || '').replace(/\s+/g, ' ').trim();
          const opsi_a = (cells[2].textContent || '').replace(/\s+/g, ' ').trim();
          const opsi_b = (cells[3].textContent || '').replace(/\s+/g, ' ').trim();
          const opsi_c = (cells[4].textContent || '').replace(/\s+/g, ' ').trim();
          const opsi_d = (cells[5].textContent || '').replace(/\s+/g, ' ').trim();

          if (!pertanyaan && !rawImgSrc && !opsi_a && !opsi_b) continue;

          let kunci_jawaban = (cells[6].textContent || '').trim().toUpperCase();
          if (!['A', 'B', 'C', 'D'].includes(kunci_jawaban)) {
            kunci_jawaban = 'A';
          }

          const rawBobot = parseInt((cells[7] ? cells[7].textContent : '1').replace(/[^0-9]/g, ''), 10);
          const bobot = !isNaN(rawBobot) && rawBobot > 0 ? rawBobot : 1;

          // Jika ada gambar base64 di sel soal, unggah ke bucket 'gambar-soal'
          let finalImageUrl = null;
          if (rawImgSrc && rawImgSrc.startsWith('data:image/')) {
            try {
              const { blob, mime } = dataUriToBlob(rawImgSrc);
              const ext = (mime.split('/')[1] || 'png').replace('jpeg', 'jpg');
              finalImageUrl = await uploadImageBlobToStorage(blob, ext);
            } catch (uploadErr) {
              console.warn('Upload gambar ke bucket gambar-soal gagal:', uploadErr);
              if (!storageWarningShown) {
                storageWarningShown = true;
                showToast('Catatan: Pastikan bucket "gambar-soal" di Supabase Storage sudah diatur Public & Policy INSERT aktif.', 'warning');
              }
            }
          }

          parsedItems.push({
            tempId: `WORD-${Date.now()}-${i}`,
            pertanyaan: pertanyaan || '(Perhatikan gambar berikut)',
            gambar_url: finalImageUrl,
            opsi_a: opsi_a || '-',
            opsi_b: opsi_b || '-',
            opsi_c: opsi_c || '-',
            opsi_d: opsi_d || '-',
            kunci_jawaban,
            bobot
          });
        }

        event.target.value = '';

        if (parsedItems.length === 0) {
          throw new Error('Tidak ditemukan baris soal yang valid pada tabel Word.');
        }

        state.teacher.wordPreview = {
          fileName: file.name,
          items: parsedItems,
          uploadingImages: false,
          savingToDb: false
        };
        render();
        showToast(`${parsedItems.length} soal berhasil diekstrak dari Word! Periksa pratinjau di bawah.`, 'success');
      } catch (err) {
        event.target.value = '';
        state.teacher.wordPreview = { fileName: '', items: [], uploadingImages: false, savingToDb: false };
        render();
        showToast(err.message || 'Gagal membaca file Word.', 'error');
      }
    }

    // Tambah Soal Manual (dengan gambar opsional)
    async function handleAddManualQuestion(event) {

      const exam = getSelectedTeacherExam();

      const pertanyaan = f.pertanyaan.value.trim();

      const opsi_c = f.opsi_c.value.trim();

      const kunci_jawaban = f.kunci_jawaban.value;
      const bobot = Math.max(1, parseInt(f.bobot.value, 10) || 1);
      const imageFile = f.gambar_file && f.gambar_file.files ? f.gambar_file.files[0] : null;

      if (!pertanyaan || !opsi_a || !opsi_b || !opsi_c || !opsi_d) {
        showToast('Lengkapi pertanyaan dan seluruh opsi A–D.', 'warning');

      render();

      try {
        let gambar_url = null;

            pertanyaan,
            gambar_url,
            opsi_a,
            opsi_b,
            opsi_c,
            opsi_d,

            bobot

    // --- TAB 2 & 3: MONITORING REALTIME & REKAP NILAI ---
    async function loadTeacherMonitoringSessions(examId) {
      if (!supabaseClient || !examId) return;
      state.teacher.loadingSessions = true;
      render();

      try {
        // Ambil sesi ujian beserta profil siswa
        const { data: sessionsData, error } = await supabaseClient
          .from('exam_sessions')
          .select(`
            *,
            profiles:siswa_id (
              id,
              nama_lengkap,
              username,
              kelas_atau_mapel
            )
          `)
          .eq('exam_id', examId)
          .order('waktu_mulai', { ascending: false });

        if (error) throw error;

        const sessions = sessionsData || [];

        // Ambil jumlah jawaban per session_id untuk indikator progres
        if (sessions.length > 0) {
          const sessionIds = sessions.map(s => s.id);
          const { data: answersData } = await supabaseClient
            .from('student_answers')
            .select('session_id')
            .in('session_id', sessionIds);

          const countMap = {};
          (answersData || []).forEach(row => {
            countMap[row.session_id] = (countMap[row.session_id] || 0) + 1;
          });

          sessions.forEach(s => {
            s.answeredCount = countMap[s.id] || 0;
          });
        }

        state.teacher.sessions = sessions;
      } catch (err) {
        console.error(err);
        showToast('Gagal memuat data kehadiran peserta: ' + err.message, 'error');
      } finally {
        state.teacher.loadingSessions = false;
        render();
      }
    }

    function subscribeTeacherRealtimeMonitoring(examId) {
      if (!supabaseClient || !examId) return;
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      realtimeChannel = supabaseClient
        .channel(`teacher-monitoring-${examId}`)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'exam_sessions',
            filter: `exam_id=eq.${examId}`
          },
          async (payload) => {
            if (payload.new && payload.new.status === 'terkunci') {
              showToast('PERINGATAN PENGAWAS: Terdeteksi peserta melanggar aturan layar (Terkunci)!', 'error');
            }
            await loadTeacherMonitoringSessions(examId);
          }
        )
        .subscribe();
    }

    async function resetStudentLock(sessionId, studentName) {
      if (!supabaseClient) return;

    // Export Nilai ke Excel (.xlsx) menggunakan SheetJS
    function exportGradesToExcelXlsx() {
      const exam = getSelectedTeacherExam();
      if (!exam || !window.XLSX) {
        showToast('Data ujian atau library Excel belum siap.', 'warning');
        return;
      }

      if (state.teacher.sessions.length === 0) {
        showToast('Belum ada data peserta ujian untuk diekspor.', 'warning');
        return;
      }

      const statusLabelMap = {
        mengerjakan: 'Sedang Mengerjakan',
        terkunci: 'Terkunci (Pelanggaran)',
        selesai: 'Selesai'
      };

      const rows = state.teacher.sessions.map((s, idx) => {
        const prof = s.profiles || {};
        return {
          'No': idx + 1,
          'Username / NIS': prof.username || '-',
          'Nama Lengkap Siswa': prof.nama_lengkap || '-',
          'Kelas': prof.kelas_atau_mapel || '-',
          'Mata Pelajaran': exam.mapel,
          'Judul Ujian': exam.judul_ujian,
          'Status Kehadiran': statusLabelMap[s.status] || s.status,
          'Waktu Mulai': formatDateTimeID(s.waktu_mulai),
          'Waktu Selesai': formatDateTimeID(s.waktu_selesai),
          'Nilai Akhir': Number(s.nilai_akhir || 0)
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!cols'] = [
        { wch: 5 },
        { wch: 18 },
        { wch: 28 },
        { wch: 14 },
        { wch: 20 },
        { wch: 26 },
        { wch: 22 },
        { wch: 18 },
        { wch: 18 },
        { wch: 14 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekap Nilai');

      const safeFileName = `Rekap_Nilai_${exam.mapel}_${exam.judul_ujian}`
        .replace(/[^a-zA-Z0-9_-]/g, '_')
        .replace(/_+/g, '_');

      XLSX.writeFile(workbook, `${safeFileName}.xlsx`);
      showToast(`File ${safeFileName}.xlsx berhasil diunduh!`, 'success');
    }

    /**
     * ============================================================================
     * 7. LOGIKA PORTAL UJIAN SISWA (ANTI-CURANG & REALTIME UNLOCK)
     * ============================================================================
     */
    async function loadActiveExamsForStudent() {
      if (!supabaseClient || !state.profile) return;
      state.student.loadingExams = true;
      render();

      try {
        // Ambil daftar ujian aktif
        const { data: examsData, error: examsErr } = await supabaseClient
          .from('exams')
          .select('*')
          .eq('is_active', true)
          .order('created_at', { ascending: false });

        if (examsErr) throw examsErr;

        // Ambil riwayat sesi milik siswa ini untuk menampilkan status (sedang mengerjakan/terkunci/selesai)
        const { data: mySessions, error: sessErr } = await supabaseClient
          .from('exam_sessions')
          .select('*')
          .eq('siswa_id', state.profile.id);

        if (sessErr) throw sessErr;

        const sessMap = {};
        (mySessions || []).forEach(s => {
          sessMap[s.exam_id] = s;
        });

        state.student.activeExams = examsData || [];
        state.student.existingSessionsMap = sessMap;
      } catch (err) {
        showToast('Gagal memuat daftar ujian aktif: ' + err.message, 'error');
      } finally {
        state.student.loadingExams = false;
        render();
      }
    }

    async function handleStudentJoinExam(event) {
      event.preventDefault();
      if (!supabaseClient || !state.profile) return;

      const f = event.target;
      const examId = f.exam_id.value;
      const inputToken = (f.token_ujian.value || '').trim().toUpperCase();

      const exam = state.student.activeExams.find(e => e.id === examId);
      if (!exam) {
        showToast('Pilih paket ujian aktif terlebih dahulu.', 'warning');
        return;
      }

      if (!inputToken || inputToken !== (exam.token_ujian || '').toUpperCase()) {
        showToast('Token Ujian tidak valid! Minta token yang benar kepada pengawas.', 'error');
        return;
      }

      state.student.loadingExams = true;
      render();

      try {
        // 1. Cek apakah sesi sudah ada di exam_sessions
        let { data: session, error: fetchSessErr } = await supabaseClient
          .from('exam_sessions')
          .select('*')
          .eq('exam_id', exam.id)
          .eq('siswa_id', state.profile.id)
          .maybeSingle();

        if (fetchSessErr) throw fetchSessErr;

        // Jika belum ada sesi, buat sesi baru
        if (!session) {
          const { data: newSession, error: insErr } = await supabaseClient
            .from('exam_sessions')
            .insert({
              exam_id: exam.id,
              siswa_id: state.profile.id,
              status: 'mengerjakan'
            })
            .select()
            .single();

          if (insErr) throw insErr;
          session = newSession;
        }

        state.student.selectedExam = exam;
        state.student.session = session;
        state.student.loadingExams = false;

        // Jika sesi sudah selesai, langsung ke layar hasil
        if (session.status === 'selesai') {
          state.student.step = 'finished';
          state.student.finalGradeResult = session.nilai_akhir;
          render();
          return;
        }

        // Ambil soal dari VIEW student_questions (aman: tanpa kolom kunci_jawaban & bobot)
        const { data: qData, error: qErr } = await supabaseClient
          .from('student_questions')
          .select('*')
          .eq('exam_id', exam.id)
          .order('nomor_urut', { ascending: true });

        if (qErr) throw qErr;
        if (!qData || qData.length === 0) {
          throw new Error('Guru belum menginput butir soal untuk paket ujian ini.');
        }

        // Acak urutan soal berdasarkan kombinasi ID siswa & ID ujian
        state.student.questions = deterministicShuffle(qData, `${state.profile.id}-${exam.id}`);
        state.student.currentIndex = 0;

        // Muat jawaban tersimpan dari student_answers jika melanjutkan ujian
        const { data: savedAns, error: ansErr } = await supabaseClient
          .from('student_answers')
          .select('question_id, jawaban')
          .eq('session_id', session.id);

        if (ansErr) throw ansErr;

        const ansMap = {};
        (savedAns || []).forEach(a => {
          if (a.jawaban) ansMap[a.question_id] = a.jawaban;
        });
        state.student.answersMap = ansMap;
        state.student.doubtfulMap = {};

        // Hitung sisa waktu dari waktu_mulai server + durasi_menit
        const startMs = new Date(session.waktu_mulai).getTime();
        const endMs = startMs + exam.durasi_menit * 60 * 1000;
        const remSec = Math.max(0, Math.floor((endMs - Date.now()) / 1000));
        state.student.remainingSeconds = remSec;

        // Subscribe Realtime untuk deteksi Reset Kunci dari pengawas
        subscribeStudentSessionRealtime(session.id);

        if (session.status === 'terkunci') {
          state.student.step = 'locked';
          render();
          return;
        }

        if (remSec <= 0) {
          await executeSubmitAndGradeExam(true);
          return;
        }

        state.student.step = 'exam';
        startStudentCountdownTimer();
        render();
        showToast('Sesi ujian dimulai! Sistem pengawasan layar aktif.', 'success');
      } catch (err) {
        state.student.loadingExams = false;
        render();
        showToast(err.message || 'Gagal memulai ujian.', 'error');
      }
    }

    function startStudentCountdownTimer() {
      if (countdownInterval) clearInterval(countdownInterval);

      countdownInterval = setInterval(async () => {
        if (state.screen !== 'student' || state.student.step !== 'exam') return;

        const exam = state.student.selectedExam;
        const session = state.student.session;
        if (!exam || !session) return;

        const endMs = new Date(session.waktu_mulai).getTime() + exam.durasi_menit * 60 * 1000;
        const remSec = Math.max(0, Math.floor((endMs - Date.now()) / 1000));
        state.student.remainingSeconds = remSec;

        const timerEl = document.getElementById('student-timer-display');
        if (timerEl) {
          timerEl.textContent = formatCountdown(remSec);
          if (remSec <= 300) {
            timerEl.parentElement.classList.add('bg-rose-600', 'animate-pulse');
          }
        }

        if (remSec <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          showToast('Waktu pengerjaan telah habis! Jawaban dikumpulkan otomatis.', 'warning');
          await executeSubmitAndGradeExam(true);
        }
      }, 1000);
    }

    // Auto-save pilihan jawaban A/B/C/D ke tabel student_answers
    async function handleStudentSelectAnswer(questionId, jawaban) {
      if (!supabaseClient || !state.student.session) return;
      if (state.student.session.status !== 'mengerjakan') return;

      // Update UI secara optimistik terlebih dahulu agar responsif di HP
      state.student.answersMap[questionId] = jawaban;
      state.student.savingAnswerId = questionId;
      render();

      try {
        const { error } = await supabaseClient
          .from('student_answers')
          .upsert(
            {
              session_id: state.student.session.id,
              question_id: questionId,
              jawaban
            },
            { onConflict: 'session_id,question_id' }
          );

        if (error) throw error;
        state.student.lastSavedText = `Tersimpan (${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })})`;
      } catch (err) {
        showToast('Gagal menyimpan jawaban otomatis: ' + err.message, 'error');
      } finally {
        state.student.savingAnswerId = null;
        render();
      }
    }

    function toggleStudentDoubtful(questionId) {
      state.student.doubtfulMap[questionId] = !state.student.doubtfulMap[questionId];
      render();
    }

    function goToStudentQuestionIndex(idx) {
      if (idx >= 0 && idx < state.student.questions.length) {
        state.student.currentIndex = idx;
        render();
      }
    }

    // --- PROTEKSI ANTI-CURANG & REALTIME UNLOCK ---
    function isStudentCurrentlyInActiveExam() {
      return (
        state.screen === 'student' &&
        state.student.step === 'exam' &&
        state.student.session &&
        state.student.session.status === 'mengerjakan' &&
        !state.student.submittingExam
      );
    }

    async function lockStudentExamDueToViolation(reasonText) {
      if (!isStudentCurrentlyInActiveExam() || !supabaseClient) return;

      const session = state.student.session;
      session.status = 'terkunci';
      session.catatan_pelanggaran = reasonText;
      state.student.step = 'locked';
      render();

      try {
        await supabaseClient
          .from('exam_sessions')
          .update({
            status: 'terkunci',
            catatan_pelanggaran: reasonText
          })
          .eq('id', session.id);
      } catch (err) {
        console.error('Gagal mengirim status terkunci ke server:', err);
      }
    }

    // Berlangganan Realtime pada baris sesi siswa agar otomatis terbuka saat guru menekan "Reset Kunci"
    function subscribeStudentSessionRealtime(sessionId) {
      if (!supabaseClient || !sessionId) return;
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      realtimeChannel = supabaseClient
        .channel(`student-session-${sessionId}`)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'exam_sessions',
            filter: `id=eq.${sessionId}`
          },
          (payload) => {
            const updated = payload.new;
            if (!updated || !state.student.session) return;

            state.student.session = { ...state.student.session, ...updated };

            if (updated.status === 'mengerjakan' && state.student.step === 'locked') {
              state.student.step = 'exam';
              startStudentCountdownTimer();
              render();
              showToast('Kunci ujian telah dibuka oleh pengawas! Silakan lanjutkan mengerjakan.', 'success');
            } else if (updated.status === 'selesai' && state.student.step !== 'finished') {
              state.student.step = 'finished';
              state.student.finalGradeResult = updated.nilai_akhir;
              render();
            }
          }
        )
        .subscribe();
    }

    // Fallback manual check jika WebSocket terhambat jaringan sekolah
    async function checkStudentUnlockStatusManual() {
      if (!supabaseClient || !state.student.session) return;
      try {
        const { data, error } = await supabaseClient
          .from('exam_sessions')
          .select('*')
          .eq('id', state.student.session.id)
          .single();

        if (error) throw error;
        state.student.session = data;

        if (data.status === 'mengerjakan') {
          state.student.step = 'exam';
          startStudentCountdownTimer();
          render();
          showToast('Akses dibuka oleh pengawas! Ujian dilanjutkan.', 'success');
        } else {
          showToast('Status masih terkunci. Minta pengawas menekan "Reset Kunci".', 'warning');
        }
      } catch (err) {
        showToast('Gagal memeriksa status: ' + err.message, 'error');
      }
    }

    // Konfirmasi & Eksekusi RPC Penilaian Server submit_and_grade_exam
    function promptStudentFinishExam() {
      const totalQ = state.student.questions.length;
      const answeredQ = state.student.questions.filter(q => Boolean(state.student.answersMap[q.id])).length;
      const unansweredQ = totalQ - answeredQ;

      openConfirmModal({
        title: 'Kumpulkan Jawaban & Akhiri Ujian?',
        message: unansweredQ > 0
          ? `Anda telah menjawab ${answeredQ} dari ${totalQ} soal (masih ada ${unansweredQ} soal belum dijawab). Setelah dikumpulkan, jawaban tidak dapat diubah lagi.`
          : `Seluruh ${totalQ} soal telah terjawab. Tekan tombol di bawah untuk mengakhiri ujian dan menghitung nilai akhir Anda di server.`,
        confirmLabel: 'Ya, Selesai & Kumpulkan',
        confirmClass: 'bg-emerald-600 hover:bg-emerald-700',
        onConfirm: async () => {
          await executeSubmitAndGradeExam(false);
        }
      });
    }

    async function executeSubmitAndGradeExam(isAutoTimeout = false) {
      if (!supabaseClient || !state.student.session || state.student.submittingExam) return;

      state.student.submittingExam = true;
      render();

      try {
        const { data: gradeData, error } = await supabaseClient.rpc('submit_and_grade_exam', {
          p_session_id: state.student.session.id
        });

        if (error) throw error;

        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }

        state.student.session.status = 'selesai';
        state.student.session.nilai_akhir = gradeData;
        state.student.finalGradeResult = gradeData;
        state.student.submittingExam = false;
        state.student.step = 'finished';
        render();

        if (!isAutoTimeout) {
          showToast('Ujian selesai! Nilai akhir berhasil dihitung oleh server.', 'success');
        }
      } catch (err) {
        state.student.submittingExam = false;
        render();
        showToast('Gagal mengumpulkan ujian: ' + err.message, 'error');
      }
    }

    function backToStudentExamList() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      if (realtimeChannel && supabaseClient) {
        supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
      state.student.step = 'select_exam';
      state.student.selectedExam = null;
      state.student.session = null;
      state.student.questions = [];
      state.student.answersMap = {};
      loadActiveExamsForStudent();
    }

    /**
     * ============================================================================
     * 8. EVENT LISTENER KEAMANAN BROWSER (BLOKIR KLIK KANAN, SHORTCUT, BLUR/TAB)
     * ============================================================================
     */
    document.addEventListener('contextmenu', (e) => {
      if (isStudentCurrentlyInActiveExam()) {
        e.preventDefault();
      }
    });

    ['copy', 'cut', 'paste'].forEach(evtName => {
      document.addEventListener(evtName, (e) => {
        if (isStudentCurrentlyInActiveExam()) {
          e.preventDefault();
          showToast('Fitur salin/tempel dinonaktifkan selama ujian berlangsung.', 'warning');
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (!isStudentCurrentlyInActiveExam()) return;

      const key = e.key.toUpperCase();
      const isCtrlOrMeta = e.ctrlKey || e.metaKey;

      // Blokir F12, Ctrl+Shift+I/J/C, Ctrl+U, PrintScreen
      if (
        e.key === 'F12' ||
        (isCtrlOrMeta && e.shiftKey && ['I', 'J', 'C'].includes(key)) ||
        (isCtrlOrMeta && ['U', 'S', 'P'].includes(key))
      ) {
        e.preventDefault();
        showToast('Pintasan keyboard pengembang dinonaktifkan selama ujian.', 'warning');
      }
    });

    // Deteksi berpindah tab / memanggil Google Lens / split screen
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isStudentCurrentlyInActiveExam()) {
        lockStudentExamDueToViolation('Meninggalkan layar ujian / Membuka tab atau aplikasi lain');
      }
    });

    window.addEventListener('blur', () => {
      if (!isStudentCurrentlyInActiveExam()) return;
      if (blurLockTimeout) clearTimeout(blurLockTimeout);
      blurLockTimeout = setTimeout(() => {
        if (isStudentCurrentlyInActiveExam() && !document.hasFocus()) {
          lockStudentExamDueToViolation('Kehilangan fokus layar (Deteksi Google Lens / Split-Screen / Floating App)');
        }
      }, 250);
    });

                        1. Pilih Ujian yang Sedang Berlangsung
                      </label>
                      <div class="space-y-2.5">
                        ${st.activeExams.map((ex, i) => {
                          const existingSess = st.existingSessionsMap[ex.id];
                          let badge = `<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[11px] font-bold">Tersedia</span>`;
                          if (existingSess) {
                            if (existingSess.status === 'selesai') {
                              badge = `<span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 text-[11px] font-bold">Selesai (Nilai: ${existingSess.nilai_akhir})</span>`;
                            } else if (existingSess.status === 'terkunci') {
                              badge = `<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-700 text-[11px] font-bold">Terkunci Pengawas</span>`;
                            } else {
                              badge = `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[11px] font-bold">Lanjutkan Sesi</span>`;
                            }
                          }

                          return `
                            <label class="block p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 cursor-pointer transition">
                              <div class="flex items-start gap-3">
                                <input type="radio" name="exam_id" value="${ex.id}" ${i === 0 ? 'checked' : ''} class="mt-1 text-indigo-600 focus:ring-indigo-500" />
                                <div class="flex-1">
                                  <div class="flex flex-wrap items-center justify-between gap-1">
                                    <span class="text-sm font-bold text-slate-900">${escapeHTML(ex.mapel)}</span>
                                    ${badge}
                                  </div>
                                  <div class="text-xs text-slate-600 mt-0.5">${escapeHTML(ex.judul_ujian)}</div>
                                  <div class="text-[11px] text-slate-400 mt-1">Durasi pengerjaan: ${ex.durasi_menit} Menit</div>
                                </div>
                              </div>
                            </label>
                          `;
                        }).join('')}
                      </div>
                    </div>

                    <div>
                      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        2. Masukkan Token Ujian (6 Karakter)
                      </label>
                      <input
                        type="text"
                        name="token_ujian"
                        maxlength="6"
                        required
                        placeholder="XXXXXX"
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-center font-mono text-xl font-extrabold tracking-[0.3em] uppercase text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none"
                      />
                    </div>

                    <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed flex items-start gap-2.5">
                      <i data-lucide="shield-alert" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                      <span>
                        <strong>Perhatian:</strong> Setelah menekan mulai, jangan berpindah tab, membuka split-screen, atau memanggil Google Lens karena layar akan otomatis terkunci.
                      </span>
                    </div>

                    <button
                      type="submit"
                      class="w-full py-3.5 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2 cursor-pointer"
                    >
                      <span>Mulai Mengerjakan Ujian</span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                  </form>
                `}
              </div>
            </div>
          </div>
        `;
      }

      // LAYAR TERKUNCI PELANGGARAN (MERAH PENUH)
      if (st.step === 'locked') {
        return `
          <div class="fixed inset-0 z-50 bg-rose-950 text-white flex items-center justify-center p-5 overflow-y-auto">
            <div class="max-w-md w-full text-center">
              <div class="w-20 h-20 rounded-full bg-rose-500/20 border-2 border-rose-400 flex items-center justify-center mx-auto mb-5 animate-pulse">
                <i data-lucide="shield-off" class="w-10 h-10 text-rose-400"></i>
              </div>
              <span class="px-3 py-1 rounded-full bg-rose-500/30 border border-rose-400/50 text-rose-200 text-xs font-bold uppercase tracking-wider">
                Pelanggaran Keamanan Layar
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold mt-3 mb-2">LAYAR UJIAN TERKUNCI!</h2>
              <p class="text-sm text-rose-100 leading-relaxed mb-6">
                Sistem mendeteksi Anda meninggalkan layar ujian atau membuka aplikasi lain. Laporan otomatis terkirim ke pengawas ruang.
              </p>

              <div class="bg-rose-900/70 border border-rose-700 rounded-2xl p-4 text-left text-xs space-y-2 mb-6">
                <div class="flex justify-between">
                  <span class="text-rose-300">Peserta:</span>
                  <span class="font-bold">${escapeHTML(prof.nama_lengkap)}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-rose-300">Ujian:</span>
                  <span class="font-semibold">${escapeHTML(st.selectedExam ? st.selectedExam.mapel : '-')}</span>
                </div>
                <div class="pt-1 border-t border-rose-800 text-amber-300">
                  Catatan: ${escapeHTML((st.session && st.session.catatan_pelanggaran) || 'Kehilangan fokus layar')}
                </div>
              </div>

              <p class="text-xs text-rose-200 mb-4">
                Silakan melapor kepada pengawas ruang. Layar ini akan <strong>terbuka otomatis</strong> begitu pengawas menekan tombol <em>Reset Kunci</em>.
              </p>

              <button
                type="button"
                onclick="checkStudentUnlockStatusManual()"
                class="w-full py-3 px-4 rounded-xl bg-white text-rose-950 hover:bg-rose-50 font-bold text-xs sm:text-sm shadow-lg transition cursor-pointer"
              >
                Cek Status Kunci Sekarang
              </button>
            </div>
          </div>
        `;
      }

      // LAYAR SELESAI & HASIL NILAI DARI SERVER
      if (st.step === 'finished') {
        const finalScore = st.finalGradeResult !== null ? st.finalGradeResult : (st.session ? st.session.nilai_akhir : 0);
        return `
          <div class="max-w-lg mx-auto py-4 sm:py-8">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-6 sm:p-8 text-center">
              <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle-2" class="w-9 h-9"></i>
              </div>
              <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">
                Jawaban Terkumpul &amp; Terverifikasi
              </span>
              <h2 class="text-2xl font-extrabold text-slate-900 mt-2 mb-1">Ujian Telah Selesai</h2>
              <p class="text-xs sm:text-sm text-slate-500 mb-6">
                Terima kasih, <strong>${escapeHTML(prof.nama_lengkap)}</strong>. Nilai akhir Anda telah dikalkulasi otomatis oleh server sekolah.
              </p>

              <div class="p-6 rounded-2xl bg-slate-900 text-white mb-6">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Nilai Akhir Anda</div>
                <div class="text-5xl font-extrabold text-emerald-400 mt-1">${finalScore}</div>
                <div class="text-xs text-slate-400 mt-2">${escapeHTML(st.selectedExam ? `${st.selectedExam.mapel} — ${st.selectedExam.judul_ujian}` : '')}</div>
              </div>

              <button
                type="button"
                onclick="backToStudentExamList()"
                class="w-full py-3 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm cursor-pointer"
              >
                Kembali ke Daftar Ujian
              </button>
            </div>
          </div>
        `;
      }

      // LANGKAH 2: LAYAR PENGERJAAN SOAL AKTIF
      const currentQ = st.questions[st.currentIndex];
      if (!currentQ) return '';

      const selectedOpt = st.answersMap[currentQ.id] || null;
      const isDoubtful = Boolean(st.doubtfulMap[currentQ.id]);
      const answeredCount = st.questions.filter(q => Boolean(st.answersMap[q.id])).length;

      return `
        <div class="exam-no-select max-w-5xl mx-auto space-y-4">
          <!-- Bar Status Ujian & Timer -->
          <div class="bg-slate-900 text-white rounded-2xl px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-md">
            <div>
              <div class="flex items-center gap-2 text-[11px] font-bold text-emerald-400">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Mode Ujian Terproteksi Aktif</span>
              </div>
              <h2 class="text-sm sm:text-base font-extrabold mt-0.5">
                ${escapeHTML(st.selectedExam.mapel)} — ${escapeHTML(st.selectedExam.judul_ujian)}
              </h2>
            </div>

            <div class="flex items-center gap-3">
              ${st.lastSavedText ? `<span class="hidden md:inline text-[11px] text-slate-400">${escapeHTML(st.lastSavedText)}</span>` : ''}
              <div class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 font-mono text-base font-extrabold text-amber-400">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span id="student-timer-display">${formatCountdown(st.remainingSeconds)}</span>
              </div>
            </div>
          </div>

          <!-- Grid Area Soal & Navigasi Nomor -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <!-- Kartu Pertanyaan (8 kolom) -->
            <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                  <span class="px-3 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold">
                    Soal No. ${st.currentIndex + 1} dari ${st.questions.length}
                  </span>
                  <span class="text-xs font-medium text-slate-400">
                    ${st.savingAnswerId === currentQ.id ? 'Menyimpan...' : selectedOpt ? `Terpilih: ${selectedOpt}` : 'Belum dijawab'}
                  </span>
                </div>

                <p class="text-sm sm:text-base font-medium text-slate-800 leading-relaxed mb-4">
                  ${escapeHTML(currentQ.pertanyaan)}
                </p>

                ${currentQ.gambar_url ? `
                  <div class="mb-5 p-3 rounded-2xl bg-slate-50 border border-slate-200 inline-block max-w-full">
                    <img src="${escapeHTML(currentQ.gambar_url)}" alt="Gambar Soal" onerror="this.src='https://placehold.co/400x200/e2e8f0/475569?text=Gambar+Soal'" class="max-h-60 rounded-xl object-contain" />
                  </div>
                ` : ''}

                <!-- Pilihan Ganda A - D -->
                <div class="space-y-3">
                  ${['A', 'B', 'C', 'D'].map(optKey => {
                    const textVal = currentQ[`opsi_${optKey.toLowerCase()}`];
                    const isSelected = selectedOpt === optKey;
                    return `
                      <button
                        type="button"
                        onclick="handleStudentSelectAnswer('${currentQ.id}', '${optKey}')"
                        class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition-all flex items-center gap-3.5 cursor-pointer ${
                          isSelected
                            ? 'border-indigo-600 bg-indigo-50/80 shadow-xs'
                            : 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50'
                        }"
                      >
                        <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shrink-0 ${
                          isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'
                        }">${optKey}</span>
                        <span class="text-sm ${isSelected ? 'font-semibold text-indigo-950' : 'text-slate-700'}">
                          ${escapeHTML(textVal)}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Navigasi Bawah Soal -->
              <div class="pt-6 mt-6 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2.5">
                <button
                  type="button"
                  onclick="goToStudentQuestionIndex(${st.currentIndex - 1})"
                  ${st.currentIndex === 0 ? 'disabled' : ''}
                  class="px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm font-semibold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1.5 cursor-pointer"
                >
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  <span>Sebelumnya</span>
                </button>

                <button
                  type="button"
                  onclick="toggleStudentDoubtful('${currentQ.id}')"
                  class="px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold flex items-center gap-1.5 cursor-pointer ${
                    isDoubtful
                      ? 'bg-amber-400 border-amber-500 text-amber-950'
                      : 'bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100'
                  }"
                >
                  <input type="checkbox" ${isDoubtful ? 'checked' : ''} class="rounded pointer-events-none" />
                  <span>Ragu-ragu</span>
                </button>

                ${st.currentIndex < st.questions.length - 1 ? `
                  <button
                    type="button"
                    onclick="goToStudentQuestionIndex(${st.currentIndex + 1})"
                    class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold flex items-center gap-1.5 shadow-sm cursor-pointer"
                  >
                    <span>Selanjutnya</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                ` : `
                  <button
                    type="button"
                    onclick="promptStudentFinishExam()"
                    ${st.submittingExam ? 'disabled' : ''}
                    class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-sm cursor-pointer"
                  >
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>${st.submittingExam ? 'Mengumpulkan...' : 'Selesai & Kumpulkan'}</span>
                  </button>
                `}
              </div>
            </div>

            <!-- Panel Navigasi Nomor Soal (4 kolom) -->
            <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between gap-5">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-600">Navigasi Nomor</span>
                  <span class="text-xs font-bold text-indigo-600">${answeredCount}/${st.questions.length} Terjawab</span>
                </div>

                <div class="grid grid-cols-5 gap-2 mb-5">
                  ${st.questions.map((q, idx) => {
                    const isAns = Boolean(st.answersMap[q.id]);
                    const isRagu = Boolean(st.doubtfulMap[q.id]);
                    const isCurr = idx === st.currentIndex;

                    let style = 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200';
                    if (isRagu) style = 'bg-amber-400 text-amber-950 border-amber-500';
                    else if (isAns) style = 'bg-emerald-500 text-white border-emerald-600';

                    return `
                      <button
                        type="button"
                        onclick="goToStudentQuestionIndex(${idx})"
                        class="h-10 rounded-xl border font-bold text-xs flex items-center justify-center transition cursor-pointer ${style} ${
                          isCurr ? 'ring-2 ring-indigo-600 ring-offset-2' : ''
                        }"
                      >${idx + 1}</button>
                    `;
                  }).join('')}
                </div>

                <div class="flex flex-wrap gap-3 text-[11px] text-slate-500 mb-5">
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span>Dijawab</span>
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-400 inline-block"></span>Ragu-ragu</span>
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200 inline-block"></span>Kosong</span>
                </div>
              </div>

              <button
                type="button"
                onclick="promptStudentFinishExam()"
                ${st.submittingExam ? 'disabled' : ''}
                class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-bold text-xs sm:text-sm shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>${st.submittingExam ? 'Menghitung Nilai...' : 'Selesai & Kumpulkan'}</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- RENDER UTAMA ---
    function render() {
      renderHeaderActions();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.screen === 'login') {
        root.innerHTML = renderLoginScreen();
      } else if (state.screen === 'role_blocked') {
        root.innerHTML = renderRoleBlockedScreen();
      } else if (state.screen === 'teacher') {
        root.innerHTML = renderTeacherDashboard();
      } else if (state.screen === 'student') {
        root.innerHTML = renderStudentPortal();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Inisialisasi Aplikasi saat DOM siap
    window.addEventListener('DOMContentLoaded', async () => {
      initSupabaseClient();
      await bootstrapAuthSession();
    });
  </script>
</body>
</html>
